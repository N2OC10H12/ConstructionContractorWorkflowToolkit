spring:
  application:
    name: ConstructionContractorWorkflowToolkit

  profiles:
    active: local

server:
  port: 8080

logging:
  level:
    org.springframework.boot.context.config: DEBUG

app:
  file-storage:
    provider: ${FILE_STORAGE_PROVIDER:LOCAL}
    root-path: ${FILE_STORAGE_ROOT_PATH:./data/uploads}